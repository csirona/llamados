<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pantalla de Llamados</title>

<style>
:root {
    --bg: #0F172A;
    --panel: #1E293B;
    --gold: #FACC15;
    --text: #F8FAFC;
    --accent: #38BDF8;
}

body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    height: 100vh;
    overflow: hidden;
}

h1 {
    margin-top: 15px;
    margin-bottom: 10px;
    font-size: 3.2rem;
    font-weight: 600;
    color: var(--gold);
}

/* GRID 2 COLUMNAS */
#grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    width: 96vw;
    height: 85vh;
    gap: 14px;
    padding-bottom: 10px;
}

/* CUADROS INDIVIDUALES */
.llamado {
    background: var(--panel);
    border-left: 12px solid var(--accent);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    font-weight: bold;
    box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
}

.caja {
    font-size: 4vw;
    color: var(--gold);
}
.tipo {
    font-size: 2.4vw;
}
.hora {
    font-size: 2vw;
    opacity: .75;
}
</style>
</head>

<body>
    <h1>LLAMADOS</h1>

    <div id="grid">
        <div class="llamado" id="box1"></div>
        <div class="llamado" id="box2"></div>
        <div class="llamado" id="box3"></div>
        <div class="llamado" id="box4"></div>
        <div class="llamado" id="box5"></div>
        <div class="llamado" id="box6"></div>
        <div class="llamado" id="box7"></div>
        <div class="llamado" id="box8"></div>
        <div class="llamado" id="box9"></div>
        <div class="llamado" id="box10"></div>
    </div>

<script>
const evtSource = new EventSource("http://localhost:3033/stream");

// ✅ manejar stream
evtSource.onmessage = (event) => {
    try {
        const data = JSON.parse(event.data);

        // limpiar
        for (let i = 1; i <= 10; i++) {
            document.getElementById(`box${i}`).innerHTML = "";
        }

        data.forEach(item => {
            const caja = item.caja;
            const el = document.getElementById(`box${caja}`);

            if (!el) return;

            el.innerHTML = `
                <div class="caja">CAJA ${item.caja}</div>
                <div class="tipo">${item.tipo ?? ""}</div>
                <div class="hora">${item.hora ?? ""}</div>
            `;
        });

    } catch (err) {
        console.error("Error SSE:", err);
    }
};
</script>

</body>
</html>
