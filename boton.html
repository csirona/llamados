<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Llamador</title>
<style>
    :root {
        --bg: #0F172A;     /* Slate 900 */
        --text: #F1F5F9;   /* Slate 100 */
        --blue: #3B82F6;   /* Blue 500 */
        --green: #10B981;  /* Green 500 */
        --red: #EF4444;    /* Red 500 */
    }

    body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    h1 {
        margin-bottom: 15px;
        font-weight: 500;
    }

    .infoCaja {
        margin-bottom: 40px;
        font-size: 2rem;
        opacity: 0.85;
        font-weight: 600;
    }

    .botones {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 500px;
    }

    button {
        padding: 25px;
        font-size: 2rem;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        font-weight: 600;
        transition: all .2s;
        color: white;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    }

    button:hover {
        opacity: 0.9;
        transform: scale(1.02);
    }

    .btn-con {
        background: var(--blue);
    }

    .btn-sin {
        background: var(--green);
    }

    .btn-detener {
        background: var(--red);
        display: none;
    }

</style>
</head>
<body>

<h1>Llamador de Caja</h1>

<div class="infoCaja" id="infoCaja">Caja: --</div>

<div class="botones" id="opciones">
    <button class="btn-con" onclick="llamar('CON CARRO')">LLAMAR CON CARRO</button>
    <button class="btn-sin" onclick="llamar('SIN CARRO')">LLAMAR SIN CARRO</button>
</div>

<button class="btn-detener" id="btnDetener" onclick="desactivar()">DETENER</button>

<script>
/*  ✅ CONFIGURA AQUÍ EL NÚMERO DE LA CAJA  */
const CAJA_NUM = 10;   // <<< CAMBIA ESTE VALOR

document.getElementById("infoCaja").textContent = "Caja: " + CAJA_NUM;

let ultimaCaja = CAJA_NUM;

async function llamar(tipo) {
    await fetch("http://172.16.0.123:3033/llamado", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ caja: CAJA_NUM, tipo })
    });

    document.getElementById("opciones").style.display = "none";
    document.getElementById("btnDetener").style.display = "block";
}

async function desactivar() {
    await fetch(`http://172.16.0.123:3033/llamado/${CAJA_NUM}`, {
        method: "DELETE"
    });

    document.getElementById("opciones").style.display = "flex";
    document.getElementById("btnDetener").style.display = "none";
}
</script>

</body>
</html>
